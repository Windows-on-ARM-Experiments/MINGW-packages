name: ARM64 dos2unix validation

on:
  push:
    branches:
      - crutkas-native-arm64-dos2unix

jobs:
  build-test:
    runs-on: windows-11-arm
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANGARM64
          install: base-devel dos2unix
          update: true
          release: false

      - name: Build and run upstream tests
        shell: msys2 {0}
        run: |
          cd mingw-w64-dos2unix
          MINGW_ARCH=CLANGARM64 makepkg-mingw \
            --noconfirm \
            --syncdeps \
            --cleanbuild
          pacman --noconfirm -U mingw-w64-clang-aarch64-dos2unix-*.pkg.tar.zst

      - name: Verify ARM64 PE headers and aliases
        shell: msys2 {0}
        run: |
          set -e
          cd /clangarm64/bin
          binaries=(dos2unix unix2dos mac2unix unix2mac d2u u2d)
          for binary in "${binaries[@]}"; do
            path="${binary}.exe"
            pe_offset="$(od -An -tu4 -j 60 -N 4 "${path}" | tr -d ' ')"
            machine="$(od -An -tx2 -j "$((pe_offset + 4))" -N 2 "${path}" | tr -d ' ')"
            printf '%-13s PE machine 0x%s\n' "${path}" "${machine^^}"
            test "${machine}" = aa64
          done
          cmp dos2unix.exe mac2unix.exe
          cmp dos2unix.exe d2u.exe
          cmp unix2dos.exe unix2mac.exe
          cmp unix2dos.exe u2d.exe

      - name: Compare Git Bash behavior with MSYS package
        shell: msys2 {0}
        run: |
          set -e
          native=/clangarm64/bin
          msys=/usr/bin
          tmp="$(mktemp -d)"
          trap 'rm -rf "${tmp}"' EXIT

          "${msys}/dos2unix.exe" --help |
            grep -Eo -- '--?[a-z0-9-]+' |
            sort -u >"${tmp}/msys-options"
          "${native}/dos2unix.exe" --help |
            grep -Eo -- '--?[a-z0-9-]+' |
            sort -u >"${tmp}/native-options"
          comm -23 "${tmp}/msys-options" "${tmp}/native-options" >"${tmp}/missing-options"
          printf '%s\n' --allow-chown --follow-symlink --no-allow-chown |
            sort >"${tmp}/platform-options"
          cmp "${tmp}/missing-options" "${tmp}/platform-options"

          compare_conversion() {
            local command="$1"
            local input="$2"
            printf "${input}" >"${tmp}/msys-input"
            cp "${tmp}/msys-input" "${tmp}/native-input"
            "${msys}/${command}.exe" -q "${tmp}/msys-input"
            "${native}/${command}.exe" -q "${tmp}/native-input"
            cmp "${tmp}/msys-input" "${tmp}/native-input"
          }

          compare_conversion dos2unix 'one\r\ntwo\r\n'
          compare_conversion d2u 'one\r\ntwo\r\n'
          compare_conversion unix2dos 'one\ntwo\n'
          compare_conversion u2d 'one\ntwo\n'
          compare_conversion mac2unix 'one\rtwo\r'
          compare_conversion unix2mac 'one\ntwo\n'

          printf '\xff\xfeA\x00\r\x00\n\x00B\x00\r\x00\n\x00' >"${tmp}/msys-utf16"
          cp "${tmp}/msys-utf16" "${tmp}/native-utf16"
          "${msys}/dos2unix.exe" -q "${tmp}/msys-utf16"
          "${native}/dos2unix.exe" -q "${tmp}/native-utf16"
          cmp "${tmp}/msys-utf16" "${tmp}/native-utf16"

          (
            cd "${tmp}"
            LANG=de_DE.UTF-8 "${msys}/dos2unix.exe" missing >msys-locale 2>&1 || true
            LANG=de_DE.UTF-8 "${native}/dos2unix.exe" missing >native-locale 2>&1 || true
            diff -u msys-locale native-locale
          )

          test "$("${msys}/dos2unix.exe" --version | head -1)" = \
            "$("${native}/dos2unix.exe" --version | head -1)"

      - uses: actions/upload-artifact@v4
        with:
          name: clangarm64-dos2unix
          path: mingw-w64-dos2unix/*.pkg.tar.zst
          if-no-files-found: error
